name: Run R Script Daily

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch: {}

jobs:
  run-r-script:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev

      - name: Install R packages
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::tidyverse
            any::tidymodels
            any::here
            any::rvest
            any::httr
            any::jsonlite
            any::xgboost
            any::googlesheets4
            any::rsconnect
            any::remotes
            any::base64enc

      - name: Install baseballr
        run: Rscript -e 'remotes::install_github("BillPetti/baseballr")'

      - name: Restore Google Sheets token
        run: |
          mkdir -p ~/.config/gargle
          echo "${{ secrets.GS4_TOKEN }}" | base64 -d > ~/.config/gargle/7a6077d23f6776ccc63f8f70bc12b214_ltesler194@gmail.com
        shell: bash

      - name: Run script
        run: Rscript processing/reg_season_predictions.R
        env:
          FG_COOKIE: ${{ secrets.FG_COOKIE }}
          GARGLE_OAUTH_CACHE: ~/.config/gargle

      - name: Deploy Shiny app
        run: |
          Rscript -e '
            rsconnect::setAccountInfo(
              name = "leo-tesler-baseball",
              token = Sys.getenv("SHINYAPPS_TOKEN"),
              secret - Sys.getenv("SHINYAPPS_SECRET")
            )
            rsconnect::deployApp(
              appDir = "ExecutionPlusApp",
              forceUpdate = TRUE
            )
          '
        env:
          SHINYAPPS_TOKEN: ${{ secrets.SHINYAPPS_TOKEN }}
          SHINYAPPS_SECRET: ${{ secrets.SHINYAPPS_SECRET }}

      - name: Commit updated predictions back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add predictions/mlb_2026.rds ExecutionPlusApp/predictions/
          git diff --staged --quiet || git commit -m "Update predictions [skip ci]"
          git push
